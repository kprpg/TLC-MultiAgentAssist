    <text x="51" y="431">PRIORITY</text><text x="130" y="431">CUSTOMER / RECORD</text>
    <text x="365" y="431">WHY NOW / NEXT STEP</text><text x="655" y="431">VALUE + UNIT</text><text x="807" y="431">OWNER / DATA</text>
  </g>
