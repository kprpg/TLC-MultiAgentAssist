  <text x="43" y="1077" class="body">Design principle: busy is not the same as progressing. Missing data is not zero progress.</text>
  <text x="43" y="1098" class="small muted">MSX first. M365 is optional and permission-gated. Figures and financial examples in this mockup are synthetic and are not additive.</text>
