name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop package version v$packageVersion."
          }

      - name: Validate
        run: |
          npm run typecheck
          npm test

      - name: Package Windows application
        run: npm run desktop:package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TLC-MultiAgent-Assist-Windows-x64
          path: |
            release/*.exe
            release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $artifacts --verify-tag --generate-notes --title "TLC MultiAgent Assist $env:GITHUB_REF_NAME"