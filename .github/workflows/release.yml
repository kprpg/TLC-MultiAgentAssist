name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag. Defaults to v<desktop-version>-build.<run-number>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $releaseTag = $env:GITHUB_REF_NAME

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ([string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
              $releaseTag = "v$packageVersion-build.$env:GITHUB_RUN_NUMBER"
            } else {
              $releaseTag = $env:REQUESTED_TAG.Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw "Unable to determine release tag."
          }

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -ne "v$env:PACKAGE_VERSION") {
            throw "Tag $env:RELEASE_TAG does not match desktop package version v$env:PACKAGE_VERSION."
          }

      - name: Validate
        run: |
          npm run typecheck
          npm test

      - name: Package Windows application
        run: npm run desktop:package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TLC-MultiAgent-Assist-Windows-x64
          path: |
            release/*.exe
            release/*.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          $artifacts = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object FullName
          if (-not $artifacts) {
            throw "No release artifacts were found."
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            gh release create $env:RELEASE_TAG $artifacts --target $env:GITHUB_SHA --generate-notes --title "TLC MultiAgent Assist v$env:PACKAGE_VERSION (build $env:GITHUB_RUN_NUMBER)" --latest
          } else {
            gh release create $env:RELEASE_TAG $artifacts --verify-tag --generate-notes --title "TLC MultiAgent Assist $env:RELEASE_TAG"
          }