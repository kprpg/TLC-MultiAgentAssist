name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to v<desktop package version>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $releaseTag = $env:GITHUB_REF_NAME
          } elseif (![string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            $releaseTag = $env:REQUESTED_TAG.Trim()
          } else {
            $releaseTag = "v$packageVersion"
          }

          if ($releaseTag -ne "v$packageVersion") {
            throw "Release tag $releaseTag does not match desktop package version v$packageVersion."
          }

          "tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Validate
        run: |
          npm run typecheck
          npm test

      - name: Package Windows application
        run: npm run desktop:package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TLC-MultiAgent-Assist-Windows-x64
          path: |
            release/*.exe
            release/*.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $artifacts = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object FullName
          if (-not $artifacts) {
            throw "No release artifacts were produced."
          }

          if (gh release view $env:RELEASE_TAG *> $null) {
            throw "Release $env:RELEASE_TAG already exists. Bump apps/desktop/package.json before publishing a new desktop release."
          }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            gh release create $env:RELEASE_TAG $artifacts --verify-tag --generate-notes --title "TLC MultiAgent Assist $env:RELEASE_TAG"
          } else {
            gh release create $env:RELEASE_TAG $artifacts --target $env:GITHUB_SHA --generate-notes --title "TLC MultiAgent Assist $env:RELEASE_TAG"
          }