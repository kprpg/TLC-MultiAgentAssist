name: Nightly VS Code extension release

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when master has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-vscode-extension-release
  cancel-in-progress: false

jobs:
  extension:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since the last nightly extension build
        id: changes
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          last_built=""
          if git rev-parse -q --verify refs/tags/ext-nightly-built >/dev/null; then
            last_built=$(git rev-list -n 1 refs/tags/ext-nightly-built)
          fi

          if [[ "$FORCE_BUILD" == "true" || "$last_built" != "$GITHUB_SHA" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building commit $GITHUB_SHA (last nightly: ${last_built:-none})."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No changes since the last successful nightly extension build; skipping."
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.should_build == 'true'
        run: npm ci

      - name: Seed shared Foundry environment
        # The extension host bundle imports the gitignored config/foundry.environment.json
        # at build/type-check time. Seed it from the checked-in non-secret default without
        # overwriting a developer-provided file, matching the tagged extension release.
        if: steps.changes.outputs.should_build == 'true'
        run: cp -n config/foundry.environment.default.json config/foundry.environment.json || true

      - name: Type-check the extension
        if: steps.changes.outputs.should_build == 'true'
        run: npm run --workspace apps/vscode-extension typecheck

      - name: Run extension test suites
        if: steps.changes.outputs.should_build == 'true'
        run: npm test -- tests/unit/vscode-extension tests/contract/vscode-extension-bridge.contract.test.ts

      - name: Build and package the extension release
        if: steps.changes.outputs.should_build == 'true'
        run: npm run ext:release

      - name: Label nightly release
        if: steps.changes.outputs.should_build == 'true'
        id: label
        shell: bash
        run: |
          version=$(node -p "require('./apps/vscode-extension/package.json').version")
          date=$(date -u +%Y-%m-%d)
          short_sha=${GITHUB_SHA:0:7}
          # Tag contains "ext-v" so nightlies surface under the documented releases?q=ext-v link,
          # while staying distinct from stable ext-v<version> tags and the desktop nightly-* tags.
          tag="ext-v${version}-nightly.${date}.${short_sha}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TLC-MultiAgent-Assist-VSCode-Extension-${{ steps.label.outputs.date }}
          path: |
            release-ext/*.vsix
            release-ext/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish nightly GitHub prerelease
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.label.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.label.outputs.version }}
          RELEASE_DATE: ${{ steps.label.outputs.date }}
        run: |
          mapfile -t artifacts < <(find release-ext -maxdepth 1 -type f \( -name '*.vsix' -o -name '*.zip' \) | sort)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No VS Code extension release artifacts were found." >&2
            exit 1
          fi

          notes="Automated nightly build of commit ${GITHUB_SHA}. Type-check and the extension test suites passed. Prerelease build for early access; install the \`.vsix\` as described in the VS Code extension install guide."
          gh release create "$RELEASE_TAG" "${artifacts[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "TLC MultiAgent Assist VS Code Extension v${PACKAGE_VERSION} Nightly ${RELEASE_DATE}" \
            --notes "$notes"

      - name: Remove expired nightly extension releases
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RELEASE_TAG: ${{ steps.label.outputs.tag }}
        run: |
          # Keep the 14 most recent extension nightlies. The filter is scoped to prereleases whose
          # tag starts with "ext-v" and contains "nightly", so it never touches stable ext-v<version>
          # releases, manual ext-v*-build.* releases, or the desktop nightly-* releases.
          mapfile -t expired < <(gh release list \
            --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("ext-v")) and (.tagName | contains("nightly"))) | [.createdAt, .tagName] | @tsv' |
            sort -r |
            tail -n +15 |
            cut -f2)

          for tag in "${expired[@]}"; do
            if [[ -n "$tag" && "$tag" != "$CURRENT_RELEASE_TAG" ]]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done

      - name: Record successful nightly commit
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: |
          git tag --force ext-nightly-built "$GITHUB_SHA"
          git push origin refs/tags/ext-nightly-built --force

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          SHOULD_BUILD: ${{ steps.changes.outputs.should_build }}
          RELEASE_TAG: ${{ steps.label.outputs.tag }}
        run: |
          echo "## Nightly VS Code extension release" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SHOULD_BUILD" == "true" ]]; then
            echo "Built and tested commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Release tag: \`$RELEASE_TAG\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped because \`master\` has not changed since the last successful nightly extension build." >> "$GITHUB_STEP_SUMMARY"
          fi
